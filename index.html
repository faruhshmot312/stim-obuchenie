<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Стим — обучение операторов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Каталог товаров слева направо: поиск → сетка карточек → карточка товара со ступенями обучения */
  --bg:#f4f4f2; --surface:#ffffff; --ink:#1b1c1e; --muted:#6a6c70; --line:#e2e2de;
  --accent:#c0281f; --accent-soft:#fbe9e7; --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6400; --warn-soft:#fbf1dc;
  --dark:#1d1d1f; --dark-2:#2a2a2d; --on-dark:#f2f2f0;
  --display:"Golos Text", "Roboto", system-ui, sans-serif; --body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141415; --surface:#1e1e20; --ink:#ececea; --muted:#a3a4a8; --line:#323235;
    --accent:#ff6b5e; --accent-soft:#3a1f1c; --ok:#5fd19a; --ok-soft:#173226; --warn:#f0b54d; --warn-soft:#3a2e15;
    --dark:#0c0c0d; --dark-2:#232326; --on-dark:#f2f2f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141415; --surface:#1e1e20; --ink:#ececea; --muted:#a3a4a8; --line:#323235;
  --accent:#ff6b5e; --accent-soft:#3a1f1c; --ok:#5fd19a; --ok-soft:#173226; --warn:#f0b54d; --warn-soft:#3a2e15;
  --dark:#0c0c0d; --dark-2:#232326; --on-dark:#f2f2f0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;flex-direction:column;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 22px/1.2 var(--display);margin:0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.prog{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.bar{width:120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px var(--body)}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:36px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip b{font-weight:500;opacity:.6;margin-left:4px}
main{padding:20px 0 60px}
.meta{font-size:14px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.ph{aspect-ratio:4/3;background:var(--bg);position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;padding:10px;background:#fff}
[hidden]{display:none!important}
.ph .mono{font:700 34px var(--display);color:var(--muted);opacity:.35}
.ph .tag{position:absolute;left:10px;top:10px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px}
.tag.in{background:var(--ok-soft);color:var(--ok)}
.tag.way{background:var(--warn-soft);color:var(--warn)}
.ph .done{position:absolute;right:10px;top:10px;background:var(--ok);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font:600 16px/1.3 var(--display);margin:0;text-wrap:balance}
.cat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.price{margin-top:auto;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:17px}
.price s{color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
/* product */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--muted);font-size:15px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.hero .ph{border-radius:14px;aspect-ratio:1/1}
.hero h2{font:700 28px/1.2 var(--display);margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px}
.hero .price b{font-size:24px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:500;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.up{margin-top:10px;font-size:13px;color:var(--muted)}
.up label{color:var(--accent);cursor:pointer;text-decoration:underline}
.steps{display:flex;gap:6px;margin:24px 0 16px;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:13px}
.step[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.step[aria-current="step"] i{background:var(--accent);color:#fff}
.step.ok i{background:var(--ok);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h3{font:700 22px var(--display);margin:0 0 16px}
.srow{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .l{color:var(--accent);font-weight:700}
.srow .r{max-width:68ch}
.imp{margin-top:14px;background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent);padding:12px 14px;border-radius:8px;font-size:15px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--bg)}
.note{color:var(--muted);font-size:15px;margin:12px 0 0}
.side{background:var(--bg);border-radius:14px;padding:16px 18px}
.side h4{margin:0 0 10px;color:var(--accent);font:600 17px var(--display)}
.side p{margin:0 0 8px;font-size:15px}
.objs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.obj{background:var(--dark);color:var(--on-dark);border-radius:14px;padding:16px 18px}
.obj h4{margin:0 0 8px;color:#ff8a7e;font:600 17px var(--display)}
.obj p{margin:0;font-size:15px;opacity:.92}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-of-type{border-top:0;padding-top:0}
.q p{margin:0 0 10px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.result{margin-top:14px;padding:14px;border-radius:12px;font-weight:500}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--warn-soft);color:var(--warn)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero .ph{aspect-ratio:4/3}
  .two,.objs{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr;gap:4px}
  .step{flex:1 0 auto;justify-content:center}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .cb h3{font-size:15px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Стим <span>·</span> обучение операторов</h1>
      <div class="prog" id="prog"><span id="progtxt">Пройдено 0 из 0</span><div class="bar"><i id="progbar"></i></div></div>
    </div>
    <div class="search" id="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="q" class="sr" style="position:absolute;left:-9999px">Поиск товара</label>
      <input id="q" type="search" placeholder="Поиск: название, свойство, возражение…" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Категории"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="meta">Загружаю товары…</p></main>

<script src="app.js"></script>
</body>
</html>
